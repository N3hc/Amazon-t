@for (card of cards; track card.id; let i = $index) {
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-4 border border-gray-200 dark:border-gray-700 mb-4">

    <img [src]="card.image_small" [alt]="card.name"
      class="w-full h-48 object-contain mb-4 rounded-lg bg-white dark:bg-gray-900 p-2 border border-gray-200 dark:border-gray-700" />

    @if (editIndex() === i) {
      <!-- Modo edición -->
<!--       <input [(ngModel)]="cards[i].name" class="text-xl font-semibold mb-2 w-full" />
      <input type="number" [(ngModel)]="product[i].price" placeholder="Precio" class="mb-1 w-full" />
      <input type="number" [(ngModel)]="product[i].quantity" placeholder="Cantidad" class="mb-2 w-full" /> -->

      <button (click)="saveEdit()" class="px-3 py-1 bg-green-600 text-white rounded mr-2">Guardar</button>
      <button (click)="cancelEdit()" class="px-3 py-1 bg-gray-600 text-white rounded">Cancelar</button>
    } @else {
      <!-- Modo visualización -->
      <h3 class="text-xl font-semibold text-gray-800 dark:text-white">
        {{ i + 1 }}. {{ card.name }}
      </h3>

      @if (card.created_at) {
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-2">
          Creada: {{ card.created_at }}
        </p>
      }

      <div class="mt-4 text-sm text-gray-700 dark:text-gray-300 space-y-1">
            <p><span class="font-medium">Precio:</span> {{ product?.[i]?.price }} EUR</p>
          <p><span class="font-medium">Cantidad:</span> {{ product?.[i]?.quantity }}</p>
      </div>

      <div class="mt-4 flex space-x-2">
        <button (click)="startEdit(i)" class="px-3 py-1 bg-blue-500 text-white rounded">Editar</button>
        <button (click)="deleteCard(i)" class="px-3 py-1 bg-red-500 text-white rounded">Borrar</button>
      </div>
    }
  </div>
}
