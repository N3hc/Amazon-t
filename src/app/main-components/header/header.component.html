<div role="banner">
  <div class="bg-[#1064A6] p-2.5 grid grid-cols-1 md:grid-cols-12 items-center text-center">
    <!-- First Column: Logo and Theme Toggle -->
    <div class="ml-2 md:col-span-3 flex justify-between items-center">
      <img src="assets/logos/logo.png" 
           alt="Company Logo" 
           class="max-h-[40px] hidden md:block" 
           (click)="goToHome()"
           role="button"
           tabindex="0"
           aria-label="Home page">
      <img class="max-h-[60px] cursor-pointer hidden md:block" 
           (click)="toggleTheme()"
           [src]="isDarkMode ? 'assets/icons/solgaleoCoin.png' : 'assets/icons/lunalaCoin.png'" 
           [alt]="isDarkMode ? 'Dark theme icon' : 'Light theme icon'"
           aria-label="Toggle theme">
    </div>

    <!-- Second Column: Search + Theme Toggle (mobile) -->
    <div class="md:col-span-6 flex items-center justify-center space-x-2">
      <img class="max-h-[40px] cursor-pointer block md:hidden" 
           (click)="toggleTheme()"
           [src]="isDarkMode ? 'assets/icons/solgaleoCoin.png' : 'assets/icons/lunalaCoin.png'" 
           [alt]="isDarkMode ? 'Dark theme icon' : 'Light theme icon'"
           aria-label="Toggle theme">
      
      <form class="max-w-3/4 mx-auto flex items-center w-full" 
            role="search"
            aria-label="Site search">
        <div class="w-5/6">
          <input type="search" 
                 id="default-search" 
                 placeholder="Search" 
                 name="search" 
                 required
                 aria-required="true"
                 class="w-full px-4 py-2 text-sm text-gray-900 border border-slate-950 rounded-full bg-white focus:ring-blue-500 focus:border-blue-500">
        </div>
        <button type="submit"
                aria-label="Search"
                class="cursor-pointer bg-blue-500 text-white px-4 py-2 text-xs rounded border-blue-600
                active:border-b-[2px] active:brightness-90 active:translate-y-[2px] md:px-6 md:py-3 md:ml-4">
          <span class="block md:hidden" aria-hidden="true">🔍</span>
          <span class="hidden md:block">Search</span>
        </button>
      </form>
    </div>

    <!-- Third Column: Account and Cart -->
    <div class="md:col-span-3">
      <div class="flex justify-evenly md:justify-evenly text-white flex-wrap md:flex-nowrap">
        <div class="relative text-center cursor-pointer" 
             (click)="handleClick()"
             role="button"
             tabindex="0"
             aria-haspopup="true"
             [attr.aria-expanded]="showUserMenu && loggedIn">
          <div>
            <p class="m-0">
              Hello, {{ loggedIn ? user?.name : 'Sign in' }}<br>
              <strong>Account & Lists</strong>
            </p>
          </div>

          @if (showUserMenu && loggedIn) {
            <div class="absolute top-full right-0 mt-2 w-40 bg-white shadow-lg border border-gray-200 rounded z-10 text-black"
                 role="menu"
                 aria-label="User menu">
              <button role="menuitem"
                      class="w-full px-4 py-2 text-left hover:bg-gray-100"
                      (click)="viewProfile($event)"
                      aria-label="View profile">
                View Profile
              </button>
              <button role="menuitem"
                      class="w-full px-4 py-2 text-left hover:bg-gray-100"
                      (click)="logout($event)"
                      aria-label="Sign out">
                Sign Out
              </button>
            </div>
          }
        </div>

        <div class="relative scale-100 flex justify-center items-center">
          <button aria-label='Cart items'
                  class="relative"
                  (click)="goToCard()">
            <svg xmlns="http://www.w3.org/2000/svg" 
                 fill="none" 
                 viewBox="0 0 24 24" 
                 stroke-width="2"
                 stroke="currentColor" 
                 class="h-8 w-8 text-white"
                 aria-hidden="true">
              <path stroke-linecap="round" 
                    stroke-linejoin="round"
                    d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
            </svg>
            <span class="absolute -top-0 left-6 rounded-full bg-red-500 p-0.5 px-2 text-xs text-red-50"
                  aria-hidden="true">
              {{ getTotalItems() }}
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
