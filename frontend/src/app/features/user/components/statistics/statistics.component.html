<!-- Vendor Statistics Section -->
<section aria-labelledby="vendor-stats-heading" class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
  <h3 id="vendor-stats-heading" class="text-xl font-semibold text-gray-900 dark:text-white mb-6">📊 Sales Statistics</h3>
  
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
    <!-- Total Sales Card -->
    <div class="bg-purple-50 dark:bg-gray-700 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-purple-600 dark:text-purple-400">Total Sales</p>
          <p class="text-2xl font-bold text-gray-800 dark:text-white mt-1">{{ stats.totalSales }}</p>
        </div>
        <div class="bg-purple-600 p-3 rounded-full">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
        </div>
      </div>
      <p class="text-sm text-green-600 mt-2 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"/>
        </svg>
        {{ salesChange }}% vs last year
      </p>
    </div>

    <!-- Average Order Value -->
    <div class="bg-blue-50 dark:bg-gray-700 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-blue-600 dark:text-blue-400">Avg. Order</p>
          <p class="text-2xl font-bold text-gray-800 dark:text-white mt-1">{{ stats.averageOrder }}</p>
        </div>
        <div class="bg-blue-600 p-3 rounded-full">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
      </div>
      <p class="text-sm text-red-600 mt-2 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12 13a1 1 0 110 2H7a1 1 0 01-1-1V9a1 1 0 112 0v2.586l3.293-3.293a1 1 0 011.414 0l4 4a1 1 0 01-1.414 1.414L12 11.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l.293.293V13z" clip-rule="evenodd"/>
        </svg>
        3.2% vs last month
      </p>
    </div>

    <!-- Total Orders -->
    <div class="bg-green-50 dark:bg-gray-700 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-green-600 dark:text-green-400">Total Orders</p>
          <p class="text-2xl font-bold text-gray-800 dark:text-white mt-1">{{ stats.totalOrders }}</p>
        </div>
        <div class="bg-green-600 p-3 rounded-full">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
      </div>
      <p class="text-sm text-green-600 mt-2 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M12 7a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0V8.414l-4.293 4.293a1 1 0 01-1.414 0L8 10.414l-4.293 4.293a1 1 0 01-1.414-1.414l5-5a1 1 0 011.414 0L11 10.586 14.586 7H12z" clip-rule="evenodd"/>
        </svg>
        8.1% vs last month
      </p>
    </div>

    <!-- Top Selling Product -->
    <div class="bg-orange-50 dark:bg-gray-700 p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-orange-600 dark:text-orange-400">Top Product</p>
          <p class="text-xl font-bold text-gray-800 dark:text-white mt-1">{{ stats.topProduct }}</p>
        </div>
        <div class="bg-orange-600 p-3 rounded-full">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
          </svg>
        </div>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-300 mt-2">128 units sold</p>
    </div>
  </div>

  <!-- Sales Chart -->
  <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
    <h4 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">Sales Overview</h4>
    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4 h-64">
      <canvas #salesChart></canvas>
    </div>
  </div>
</section>
