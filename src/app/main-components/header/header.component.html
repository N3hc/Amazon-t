<div>
    <div class="bg-[#1064A6] p-2.5 grid grid-cols-1 md:grid-cols-12 items-center text-center">
        <!-- Primera columna: logo y toggle de tema -->
        <div class="ml-2 md:col-span-3 flex justify-between items-center">
            <img src="assets/logos/logo.png" alt="Logo" class="max-h-[40px] hidden md:block">
            <p class="hidden md:block"></p>
            <img class="max-h-[60px] cursor-pointer hidden md:block" (click)="toggleTheme()"
                [src]="isDarkMode ? 'assets/icons/solgaleoCoin.png' : 'assets/icons/lunalaCoin.png'" alt="Theme Icon">
            <p></p>
        </div>

        <!-- Segunda columna: buscador + icono de tema -->
        <div class="md:col-span-6 flex items-center justify-center space-x-2">
            <img class="max-h-[40px] cursor-pointer block md:hidden" (click)="toggleTheme()"
                [src]="isDarkMode ? 'assets/icons/solgaleoCoin.png' : 'assets/icons/lunalaCoin.png'" alt="Theme Icon">
            <form class="max-w-3/4 mx-auto flex items-center w-full" role="search">
                <div class="w-5/6">
                    <input
                        type="search"
                        id="default-search"
                        placeholder="Search"
                        name="search"
                        required
                        class="w-full px-4 py-2 text-sm text-gray-900 border border-slate-950 rounded-full bg-white focus:ring-blue-500 focus:border-blue-500"
                    />
                </div>
                <button class="cursor-pointer bg-blue-500 text-white px-4 py-2 text-xs rounded border-blue-600
                active:border-b-[2px] active:brightness-90 active:translate-y-[2px] md:px-6 md:py-3 md:ml-4">
                    <!-- Emote en móvil, texto en ordenador -->
                    <span class="block md:hidden">🔍</span>  <!-- Emote para móvil -->
                    <span class="hidden md:block">Search</span>  <!-- Texto "Search" para ordenador -->
                </button>
            </form>
        </div>

        <!-- Tercera columna: cuenta, devoluciones y cesta -->
        <div class="md:col-span-3">
            <div class="flex justify-evenly md:justify-evenly text-white flex-wrap md:flex-nowrap">
                <div class="text-center cursor-pointer" (click)="goToLogin()">
                    <p class="m-0">Hola, Identifícate<br><strong>Cuenta y listas</strong></p>
                </div>
                <div class="text-center">
                    <p class="m-0">Devoluciones<br><strong>y Pedidos</strong></p>
                </div>
                <div class="relative scale-100 flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="h-8 w-8 text-white">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                    </svg>
                    <span class="absolute -top-0 left-6 rounded-full bg-red-500 p-0.5 px-2 text-xs text-red-50">0</span>
                  </div>                                    
            </div>
        </div>
    </div>
</div>
