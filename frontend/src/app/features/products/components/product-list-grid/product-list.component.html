<div class="flex flex-wrap justify-center gap-6 p-6 rounded-2xl shadow-inner">
    @if (cards.length > 0) {
        @for (card of cards; track $index) {
                <div class="flex justify-center">
                    <div class="bg-white dark:bg-[#1E272A] p-4 rounded-xl shadow-lg hover:shadow-2xl transition-all w-full max-w-xs">
                        <div class="text-center cursor-pointer" (click)="selectProduct(card)">
                            <img [src]="card.image_small" class="w-full h-auto rounded-lg shadow-md">
                            <div class="mt-4">
                                <h4 class="text-lg font-bold text-gray-800 dark:text-gray-200">{{card.name}}</h4>
                            </div>
                        </div>
                    </div>
                </div>
            
        }
    } @else {
        <div class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 italic p-4">
            <img src='assets/extras/Ploading.gif' alt="Loading Sets" class="mb-2">
            <p class="text-gray-500 dark:text-gray-400 italic">Loading cards...</p>
        </div>
    }
</div>
